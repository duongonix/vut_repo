name: Release

# Builds one distribution per supported target from source in `vut_repo`, then
# publishes a SINGLE release to the public `duongonix/vut` repository and syncs
# the public distribution files (installers, releases.json, docs). Publishing
# and syncing need a token with `contents: write` on `duongonix/vut` (secret
# `VUT_RELEASE_TOKEN`); the default `GITHUB_TOKEN` cannot write to another repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      vpm: ${{ steps.versions.outputs.vpm }}
      cranelift: ${{ steps.versions.outputs.cranelift }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: |
          set -euo pipefail
          version=$(awk '/^\[workspace.package\]/{f=1} f&&/^version/{gsub(/[^0-9.]/,"");print;exit}' Cargo.toml)
          vpm=$(awk '/^\[package\]/{f=1} f&&/^version/{gsub(/[^0-9.]/,"");print;exit}' crates/vpm/Cargo.toml)
          cranelift=$(awk '/^name = "cranelift-codegen"$/{f=1} f&&/^version/{gsub(/[^0-9.]/,"");print;exit}' Cargo.lock)
          test -n "$version"
          test -n "$vpm"
          test -n "$cranelift"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "v${version}" != "$tag" ]; then
            echo "tag $tag does not match root Cargo.toml version v${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "vpm=${vpm}" >> "$GITHUB_OUTPUT"
          echo "cranelift=${cranelift}" >> "$GITHUB_OUTPUT"
          echo "vut=${version} vpm=${vpm} cranelift=${cranelift} tag=${tag}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            minimum_os: "10"
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            minimum_os: "10"
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            minimum_os: "glibc-2.31"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            minimum_os: "glibc-2.31"
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            minimum_os: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            minimum_os: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            minimum_os: "11.0"
          - runner: macos-latest
            target: aarch64-apple-darwin
            minimum_os: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm cmake

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm || true

      - name: Build release toolchain
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p vut-runtime -p vut-stdlib-native -p vut-cli -p vpm -p vut-lsp

      - name: Build packaging tool
        run: cargo build --release -p vut-dist

      - name: Prebuild startup object
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then name=vut-startup.obj; else name=vut-startup.o; fi
          rustc --edition 2024 --crate-type=lib --emit=obj -C panic=abort -C opt-level=2 \
            --target "${{ matrix.target }}" \
            -o "target/${{ matrix.target }}/release/${name}" \
            crates/vut-linker/startup/vut-startup.rs

      - name: Assemble distribution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            vutdist=target/release/vut-dist.exe
            name=vut-startup.obj
          else
            vutdist=target/release/vut-dist
            name=vut-startup.o
          fi
          args=(
            assemble
            --target "${{ matrix.target }}"
            --out dist
            --bin-dir "target/${{ matrix.target }}/release"
            --startup "target/${{ matrix.target }}/release/${name}"
            --vpm-version "${{ needs.validate.outputs.vpm }}"
            --cranelift "${{ needs.validate.outputs.cranelift }}"
            --channel stable
            --license LICENSE
            --notices THIRD-PARTY-NOTICES.md
            --build-commit "${GITHUB_SHA}"
          )
          if [ -n "${{ matrix.minimum_os }}" ]; then
            args+=(--minimum-os "${{ matrix.minimum_os }}")
          fi
          "$vutdist" "${args[@]}"

      - name: Verify distribution layout
        shell: bash
        run: |
          set -euo pipefail
          dir="dist/vut-v${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          test -f "${dir}/manifest.json"
          test -f "${dir}/version.json"
          test -f "${dir}/LICENSE"
          test -d "${dir}/bin"
          test -d "${dir}/lib/runtime/${{ matrix.target }}"
          test -d "${dir}/std"
          grep -q "\"target\": \"${{ matrix.target }}\"" "${dir}/manifest.json"
          grep -q "\"vpm\": \"${{ needs.validate.outputs.vpm }}\"" "${dir}/manifest.json"
          grep -q "\"cranelift\": \"${{ needs.validate.outputs.cranelift }}\"" "${dir}/manifest.json"

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.manifest.json
          if-no-files-found: error

  release-manifest:
    name: Assemble release manifest
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build packaging tool
        run: cargo build --release -p vut-dist
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate releases.json
        run: |
          set -euo pipefail
          target/release/vut-dist release-manifest \
            --dir artifacts \
            --out artifacts/releases.json \
            --repo duongonix/vut \
            --cranelift "${{ needs.validate.outputs.cranelift }}" \
            --channel stable
          cat artifacts/releases.json
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: artifacts/releases.json
          if-no-files-found: error

  attest:
    name: Attest ${{ matrix.target }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: artifacts
      - name: Locate archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -n1)"
          test -n "$archive"
          echo "path=${archive}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - name: Collect attestation bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ steps.attest.outputs.bundle-path }}"
          test -n "$bundle"
          cp "$bundle" "artifacts/${{ matrix.target }}.sigstore.json"
      - name: Upload attestation bundle
        uses: actions/upload-artifact@v4
        with:
          name: attest-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [validate, release-manifest, attest]
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute release checksums
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish to duongonix/vut
        env:
          GH_TOKEN: ${{ secrets.VUT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "VUT_RELEASE_TOKEN is not configured" >&2
            exit 1
          fi
          gh release create "v${{ needs.validate.outputs.version }}" \
            --repo duongonix/vut \
            --title "Vut v${{ needs.validate.outputs.version }}" \
            --notes "Vut v${{ needs.validate.outputs.version }} distributions for all supported targets." \
            artifacts/*

  sync-public:
    name: Sync public distribution files
    needs: [validate, release-manifest, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release
      - name: Push public distribution files
        env:
          GH_TOKEN: ${{ secrets.VUT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "VUT_RELEASE_TOKEN is not configured" >&2
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/duongonix/vut.git" public-repo
          # Public distribution files only: never specs/ or compiler/runtime source.
          cp install/install.sh public-repo/install.sh
          cp install/install.ps1 public-repo/install.ps1
          cp release/releases.json public-repo/releases.json
          cp public/README.md public-repo/README.md
          cp LICENSE public-repo/LICENSE
          cp CHANGELOG.md public-repo/CHANGELOG.md
          cp SECURITY.md public-repo/SECURITY.md
          cp CONTRIBUTING.md public-repo/CONTRIBUTING.md
          rm -rf public-repo/docs public-repo/benchmarks public-repo/examples
          cp -R docs public-repo/docs
          cp -R benchmarks public-repo/benchmarks
          cp -R examples public-repo/examples
          cd public-repo
          git config user.name "vut-release-bot"
          git config user.email "release@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "public repository already up to date"
          else
            git commit -m "Vut v${{ needs.validate.outputs.version }} distribution files"
            git push origin HEAD:main
          fi

  verify-install:
    name: Clean install ${{ matrix.os }}
    needs: [validate, publish, sync-public]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
    steps:
      - name: Install Vut (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VUT_VERSION: ${{ needs.validate.outputs.version }}
          VUT_HOME: ${{ runner.temp }}/vut-home
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/duongonix/vut/main/install.sh | sh -s -- --no-path
      - name: Install Vut (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VUT_VERSION: ${{ needs.validate.outputs.version }}
          VUT_HOME: ${{ runner.temp }}\vut-home
        run: |
          irm https://raw.githubusercontent.com/duongonix/vut/main/install.ps1 -OutFile install.ps1
          pwsh -NoProfile -File install.ps1 -NoPath
      - name: Smoke test the installed toolchain
        shell: bash
        env:
          VUT_HOME: ${{ runner.temp }}/vut-home
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            home="$(cygpath -u "$VUT_HOME")"
            vut="$home/bin/vut.exe"
            vpm="$home/bin/vpm.exe"
          else
            home="$VUT_HOME"
            vut="$home/bin/vut"
            vpm="$home/bin/vpm"
          fi
          "$vut" --version
          "$vpm" --version
          "$vut" doctor
          mkdir -p smoke
          printf 'fn main():\n  out("hello")\n' > smoke/hello.vut
          printf 'import math\n\nfn main():\n  out("sqrt=$(math.sqrt(9.0)) gcd=$(math.gcd(12, 18))")\n' > smoke/math.vut
          printf 'import fs\nimport os\n\nfn main():\n  out("os=$(os.name())")\n' > smoke/native.vut
          "$vut" run smoke/hello.vut
          "$vut" run smoke/math.vut
          "$vut" run smoke/native.vut
