name: M-LINK.6 release-linker E2E

# Production default verification: the RELEASE `vut` links through the platform
# toolchain (no `VUT_LINKER` override) and must build+run with no rustc/cargo on
# PATH. The startup object is prebuilt, as an installed distribution would ship
# it; the final link uses link.exe / cc only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm || true

      - name: Build release runtime and CLI
        run: cargo build --release -p vut-runtime -p vut-stdlib-native -p vut-cli

      - name: Prebuild startup object
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then name=vut-startup.obj; else name=vut-startup.o; fi
          rustc --edition 2024 --crate-type=lib --emit=obj -C panic=abort -C opt-level=2 \
            -o "target/release/${name}" crates/vut-linker/startup/vut-startup.rs
          ls -l "target/release/${name}"

      - name: Release default E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Drop rustup/cargo from PATH: the release linker must not need rustc.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch 'cargo|rustup' }) -join ';'
          if (Get-Command rustc -ErrorAction SilentlyContinue) { throw 'rustc is still on PATH' }
          $doctor = .\target\release\vut.exe doctor
          $doctor | Write-Output
          if (-not ($doctor | Select-String -Pattern 'backend: system')) { throw 'release default is not the system backend' }
          .\target\release\vut.exe build spikes/mlink0/fixtures/fx-stdlib/main.vut --output system-e2e.exe
          .\system-e2e.exe | Tee-Object run.out
          if (-not (Select-String -Path run.out -Pattern 'os=' -Quiet)) { throw 'missing os= output' }

      - name: Release default E2E (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -vE 'cargo|rustup' | paste -sd: -)"
          if command -v rustc >/dev/null 2>&1; then
            echo "rustc is still on PATH; aborting"; exit 1
          fi
          target/release/vut doctor | tee doctor.out
          grep -q 'backend: system' doctor.out
          target/release/vut build spikes/mlink0/fixtures/fx-stdlib/main.vut --output system-e2e
          ./system-e2e | tee run.out
          grep -q 'os=' run.out
