[package]
name = "vpm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
[dependencies]
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
blake3 = "1"
fs2 = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.23"
vut-compiler = { path = "../vut-compiler" }
vut-paths = { path = "../vut-paths" }
vut-tooling = { path = "../vut-tooling" }
[[bin]]
name = "vpm"
path = "src/main.rs"
[lints]
workspace = true
