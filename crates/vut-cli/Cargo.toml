[package]
name = "vut-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vut-compiler = { path = "../vut-compiler" }
vut-diagnostics = { path = "../vut-diagnostics" }
vut-linker = { path = "../vut-linker" }
vut-paths = { path = "../vut-paths" }
[[bin]]
name = "vut"
path = "src/main.rs"
[lints]
workspace = true
