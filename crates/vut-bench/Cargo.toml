[package]
name = "vut-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vut-compiler = { path = "../vut-compiler" }
vut-mir = { path = "../vut-mir" }
vut-paths = { path = "../vut-paths" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"

[[bin]]
name = "vut-bench"
path = "src/main.rs"

[lints]
workspace = true
